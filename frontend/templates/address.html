{% extends "base.html" %}

{% block title %}My Addresses{% endblock %}

{% block content %}

<style>

    .address-page {
        width: 100%;
    }

    .address-header {
        margin-bottom: 20px;
    }

    .address-header h2 {
        margin: 0;
        font-size: 24px;
        color: #222;
    }

    .address-header p {
        margin-top: 5px;
        color: #777;
        font-size: 14px;
    }

    /* =========================
       ADD ADDRESS BOX
    ========================= */

    .add-address-box {
        background: #fff;
        border: 1px solid #e6e6e6;
        border-radius: 14px;
        padding: 22px;
        margin-bottom: 20px;
    }

    .add-address-box h3 {
        margin-top: 0;
        margin-bottom: 18px;
    }

    .address-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .address-form input,
    .address-form textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 11px 13px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
    }

    .address-form textarea {
        min-height: 90px;
        resize: vertical;
    }

    .full-field {
        grid-column: 1 / -1;
    }

    .default-check {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #555;
    }

    .default-check input {
        width: auto;
    }

    .save-address-btn {
        border: none;
        background: #16852a;
        color: white;
        padding: 11px 20px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
    }

    .save-address-btn:hover {
        opacity: .9;
    }


    /* =========================
       ADDRESS CARD
    ========================= */

    .address-card {
        background: #fff;
        border: 1px solid #e6e6e6;
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 15px;
    }

    .address-card.default {
        border: 2px solid #16852a;
    }

    .address-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }

    .address-name {
        font-weight: 700;
        color: #222;
        font-size: 18px;
    }

    .default-badge {
        background: #e8f7ed;
        color: #16852a;
        padding: 7px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
    }

    .address-details {
        color: #666;
        font-size: 14px;
        line-height: 1.7;
    }


    /* =========================
       ACTION BUTTONS
    ========================= */

    .address-actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
        flex-wrap: wrap;
    }

    .address-action-btn {
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
    }

    .edit-btn {
        background: #eef4ff;
        color: #2563eb;
    }

    .edit-btn:hover {
        background: #e1ebff;
    }

    .delete-btn {
        background: #fff0f0;
        color: #dc2626;
    }

    .delete-btn:hover {
        background: #ffe2e2;
    }

    .default-btn {
        background: #f1f8f3;
        color: #16852a;
    }

    .default-btn:hover {
        background: #e4f3e8;
    }


    /* =========================
       INLINE EDIT BOX
    ========================= */

    .edit-address-box {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid #eee;
    }

    .edit-address-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .edit-address-form input,
    .edit-address-form textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
    }

    .edit-address-form textarea {
        min-height: 80px;
        resize: vertical;
    }

    .edit-actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
    }

    .update-btn {
        border: none;
        background: #16852a;
        color: white;
        padding: 10px 18px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
    }

    .cancel-edit-btn {
        border: none;
        background: #eee;
        color: #444;
        padding: 10px 18px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

        .address-form,
        .edit-address-form {
            grid-template-columns: 1fr;
        }

        .full-field {
            grid-column: auto;
        }

        .address-card-header {
            align-items: flex-start;
            gap: 10px;
        }

    }

</style>


<div class="address-page">

    <!-- =========================
         HEADER
    ========================= -->

    <div class="address-header">

        <h2>My Addresses</h2>

        <p>
            Manage your delivery addresses
        </p>

    </div>


    <!-- =========================
         ADD NEW ADDRESS
    ========================= -->

    <div class="add-address-box">

        <h3>
            ➕ Add New Address
        </h3>

        <form id="addressForm">

            {% csrf_token %}

            <div class="address-form">

                <input
                    type="text"
                    id="fullName"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="text"
                    id="mobile"
                    placeholder="Mobile Number"
                    maxlength="10"
                    required
                >

                <input
                    type="text"
                    id="pincode"
                    placeholder="Pincode"
                    maxlength="6"
                    required
                >

                <input
                    type="text"
                    id="city"
                    placeholder="City"
                    required
                >

                <input
                    type="text"
                    id="state"
                    placeholder="State"
                    required
                >

                <textarea
                    id="address"
                    class="full-field"
                    placeholder="Complete Address"
                    required
                ></textarea>

                <label class="default-check">

                    <input
                        type="checkbox"
                        id="isDefault"
                    >

                    Set as default address

                </label>

                <div class="full-field">

                    <button
                        type="submit"
                        class="save-address-btn"
                    >
                        Save Address
                    </button>

                </div>

            </div>

        </form>

    </div>


    <!-- =========================
         ADDRESS LIST
    ========================= -->

    <div id="addressesContainer">

        <p style="color:#777;">
            Loading addresses...
        </p>

    </div>

</div>


{% endblock %}


{% block extra_js %}

<script>


/* =========================
   CSRF TOKEN
========================= */

function getCSRFToken() {

    const csrfElement =
        document.querySelector(
            '[name=csrfmiddlewaretoken]'
        );

    return csrfElement
        ? csrfElement.value
        : "";
}


/* =========================
   LOAD ADDRESSES
========================= */

function loadAddresses() {

    fetch("/addresses/", {

        method: "GET",

        credentials: "same-origin"

    })

    .then(response => response.json())

    .then(data => {

        console.log(
            "ADDRESSES:",
            data
        );

        const container =
            document.getElementById(
                "addressesContainer"
            );


        if (!data.success) {

            container.innerHTML = `
                <p>
                    Unable to load addresses.
                </p>
            `;

            return;
        }


        /* Save addresses globally
           for Edit / Default */

        window.addressList =
            data.addresses || [];


        if (
            !data.addresses ||
            data.addresses.length === 0
        ) {

            container.innerHTML = `

                <div class="address-card">

                    <p style="
                        text-align:center;
                        color:#777;
                        margin:0;
                    ">

                        📍 No addresses added yet.

                    </p>

                </div>

            `;

            return;
        }


        let html = "";


        data.addresses.forEach(address => {


            html += `

                <div
                    class="address-card ${
                        address.is_default
                            ? "default"
                            : ""
                    }"
                    id="address-card-${address.id}"
                >


                    <!-- ADDRESS HEADER -->

                    <div class="address-card-header">

                        <div class="address-name">

                            ${address.full_name}

                        </div>


                        ${
                            address.is_default
                            ? `

                                <span class="default-badge">

                                    ⭐ Default

                                </span>

                              `
                            : ""
                        }

                    </div>


                    <!-- ADDRESS DETAILS -->

                    <div class="address-details">

                        📱 ${address.mobile}
                        <br>

                        ${address.address}
                        <br>

                        ${address.city},
                        ${address.state}
                        - ${address.pincode}

                    </div>


                    <!-- ACTION BUTTONS -->

                    <div class="address-actions">

                        <button
                            class="address-action-btn edit-btn"
                            onclick="editAddress(${address.id})"
                        >
                            ✏️ Edit
                        </button>


                        <button
                            class="address-action-btn delete-btn"
                            onclick="deleteAddress(${address.id})"
                        >
                            🗑️ Delete
                        </button>


                        ${
                            !address.is_default
                            ? `

                                <button
                                    class="address-action-btn default-btn"
                                    onclick="setDefaultAddress(${address.id})"
                                >
                                    ⭐ Set Default
                                </button>

                              `
                            : ""
                        }

                    </div>


                    <!-- INLINE EDIT AREA -->

                    <div
                        id="edit-box-${address.id}"
                        class="edit-address-box"
                        style="display:none;"
                    >

                        <div class="edit-address-form">


                            <input
                                type="text"
                                id="edit-name-${address.id}"
                                value="${address.full_name}"
                                placeholder="Full Name"
                            >


                            <input
                                type="text"
                                id="edit-mobile-${address.id}"
                                value="${address.mobile}"
                                maxlength="10"
                                placeholder="Mobile Number"
                            >


                            <input
                                type="text"
                                id="edit-pincode-${address.id}"
                                value="${address.pincode}"
                                maxlength="6"
                                placeholder="Pincode"
                            >


                            <input
                                type="text"
                                id="edit-city-${address.id}"
                                value="${address.city}"
                                placeholder="City"
                            >


                            <input
                                type="text"
                                id="edit-state-${address.id}"
                                value="${address.state}"
                                placeholder="State"
                            >


                            <textarea
                                id="edit-address-${address.id}"
                                class="full-field"
                                placeholder="Complete Address"
                            >${address.address}</textarea>


                            <label class="default-check">

                                <input
                                    type="checkbox"
                                    id="edit-default-${address.id}"
                                    ${
                                        address.is_default
                                        ? "checked"
                                        : ""
                                    }
                                >

                                Set as default address

                            </label>

                        </div>


                        <div class="edit-actions">

                            <button
                                class="update-btn"
                                onclick="updateAddress(${address.id})"
                            >
                                💾 Update
                            </button>


                            <button
                                class="cancel-edit-btn"
                                onclick="cancelEdit(${address.id})"
                            >
                                ✖ Cancel
                            </button>

                        </div>

                    </div>

                </div>

            `;

        });


        container.innerHTML = html;

    })

    .catch(error => {

        console.error(
            "Address loading error:",
            error
        );

    });

}


/* =========================
   OPEN INLINE EDIT
========================= */

function editAddress(addressId) {

    const editBox =
        document.getElementById(
            `edit-box-${addressId}`
        );

    if (!editBox) {

        return;

    }


    editBox.style.display = "block";


    const card =
        document.getElementById(
            `address-card-${addressId}`
        );

    if (card) {

        card.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(addressId) {

    const editBox =
        document.getElementById(
            `edit-box-${addressId}`
        );

    if (editBox) {

        editBox.style.display = "none";

    }

}


/* =========================
   UPDATE ADDRESS
========================= */

function updateAddress(addressId) {

    const fullName =
        document.getElementById(
            `edit-name-${addressId}`
        ).value.trim();


    const mobile =
        document.getElementById(
            `edit-mobile-${addressId}`
        ).value.trim();


    const pincode =
        document.getElementById(
            `edit-pincode-${addressId}`
        ).value.trim();


    const city =
        document.getElementById(
            `edit-city-${addressId}`
        ).value.trim();


    const state =
        document.getElementById(
            `edit-state-${addressId}`
        ).value.trim();


    const address =
        document.getElementById(
            `edit-address-${addressId}`
        ).value.trim();


    const isDefault =
        document.getElementById(
            `edit-default-${addressId}`
        ).checked;


    if (
        !fullName ||
        !mobile ||
        !pincode ||
        !city ||
        !state ||
        !address
    ) {

        alert(
            "Please fill all address fields."
        );

        return;

    }


    const data = {

        full_name: fullName,

        mobile: mobile,

        pincode: pincode,

        city: city,

        state: state,

        address: address,

        is_default: isDefault

    };


    fetch(
        `/addresses/${addressId}/`,
        {

            method: "PUT",

            credentials: "same-origin",

            headers: {

                "Content-Type":
                    "application/json",

                "X-CSRFToken":
                    getCSRFToken()

            },

            body:
                JSON.stringify(data)

        }
    )

    .then(response =>
        response.json()
    )

    .then(result => {

        console.log(
            "UPDATE ADDRESS:",
            result
        );


        if (result.success) {

            alert(
                "Address updated successfully."
            );

            loadAddresses();

        } else {

            alert(
                result.message ||
                "Unable to update address."
            );

        }

    })

    .catch(error => {

        console.error(
            "Update address error:",
            error
        );

        alert(
            "Something went wrong."
        );

    });

}


/* =========================
   DELETE ADDRESS
========================= */

function deleteAddress(addressId) {

    if (
        !confirm(
            "Are you sure you want to delete this address?"
        )
    ) {

        return;

    }


    fetch(
        `/addresses/${addressId}/`,
        {

            method: "DELETE",

            credentials: "same-origin",

            headers: {

                "X-CSRFToken":
                    getCSRFToken()

            }

        }
    )

    .then(response =>
        response.json()
    )

    .then(result => {

        console.log(
            "DELETE ADDRESS:",
            result
        );


        if (result.success) {

            alert(
                "Address deleted successfully."
            );

            loadAddresses();

        } else {

            alert(
                result.message ||
                "Unable to delete address."
            );

        }

    })

    .catch(error => {

        console.error(
            "Delete address error:",
            error
        );

        alert(
            "Something went wrong."
        );

    });

}


/* =========================
   SET DEFAULT ADDRESS
========================= */

function setDefaultAddress(addressId) {

    const address =
        window.addressList.find(
            item =>
                item.id === addressId
        );


    if (!address) {

        alert(
            "Address not found."
        );

        return;

    }


    const data = {

        full_name:
            address.full_name,

        mobile:
            address.mobile,

        pincode:
            address.pincode,

        city:
            address.city,

        state:
            address.state,

        address:
            address.address,

        is_default:
            true

    };


    fetch(
        `/addresses/${addressId}/`,
        {

            method: "PUT",

            credentials: "same-origin",

            headers: {

                "Content-Type":
                    "application/json",

                "X-CSRFToken":
                    getCSRFToken()

            },

            body:
                JSON.stringify(data)

        }
    )

    .then(response =>
        response.json()
    )

    .then(result => {

        console.log(
            "SET DEFAULT:",
            result
        );


        if (result.success) {

            alert(
                "Default address updated."
            );

            loadAddresses();

        } else {

            alert(
                result.message ||
                "Unable to set default address."
            );

        }

    })

    .catch(error => {

        console.error(
            "Default address error:",
            error
        );

        alert(
            "Something went wrong."
        );

    });

}


/* =========================
   ADD ADDRESS
========================= */

document
    .getElementById("addressForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const data = {

                full_name:
                    document
                        .getElementById(
                            "fullName"
                        )
                        .value
                        .trim(),

                mobile:
                    document
                        .getElementById(
                            "mobile"
                        )
                        .value
                        .trim(),

                pincode:
                    document
                        .getElementById(
                            "pincode"
                        )
                        .value
                        .trim(),

                city:
                    document
                        .getElementById(
                            "city"
                        )
                        .value
                        .trim(),

                state:
                    document
                        .getElementById(
                            "state"
                        )
                        .value
                        .trim(),

                address:
                    document
                        .getElementById(
                            "address"
                        )
                        .value
                        .trim(),

                is_default:
                    document
                        .getElementById(
                            "isDefault"
                        )
                        .checked

            };


            fetch(
                "/addresses/",
                {

                    method: "POST",

                    credentials:
                        "same-origin",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "X-CSRFToken":
                            getCSRFToken()

                    },

                    body:
                        JSON.stringify(data)

                }
            )

            .then(response =>
                response.json()
            )

            .then(result => {

                console.log(
                    "ADD ADDRESS:",
                    result
                );


                if (result.success) {

                    alert(
                        "Address added successfully."
                    );


                    document
                        .getElementById(
                            "addressForm"
                        )
                        .reset();


                    loadAddresses();

                } else {

                    alert(
                        result.message ||
                        "Unable to add address."
                    );

                }

            })

            .catch(error => {

                console.error(
                    "Address error:",
                    error
                );

                alert(
                    "Something went wrong."
                );

            });

        }
    );


/* =========================
   INITIAL LOAD
========================= */

loadAddresses();

</script>

{% endblock %}

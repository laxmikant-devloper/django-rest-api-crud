<style>
    /* =====================================
   ORDERS PAGE - MODERN UI
===================================== */

.orders-page {
    width: 100%;
}

.orders-header {
    margin-bottom: 24px;
}

.orders-header h2 {
    margin-top: 10px;
    font-size: 26px;

===================================== */

===================================== */

    justify-content: space-between;

    border-bottom: 1px solid #edf0f4;

    cursor: pointer;
}

.order-summary-left {

    align-items: center;
    gap: 14px;

}

.order-main-image,
.order-main-placeholder {
    width: 58px;
    height: 58px;

    flex-shrink: 0;
}

.order-main-image {

    border: 1px solid #e5e8ed;

.order-summary-info {
    min-width: 0;
}

.order-product-name {

    text-overflow: ellipsis;
}

.order-number {
    margin-top: 5px;
    font-size: 13px;

}

{% block extra_js %}

<script>
function getTrackingHtml(status) {

    const steps = [
        ["pending", "Order Placed"],
        ["confirmed", "Confirmed"],
        ["shipped", "Shipped"],
        ["out_for_delivery", "Out for Delivery"],
        ["delivered", "Delivered"]
    ];

    const statusOrder = {
        pending: 0,
        confirmed: 1,
        shipped: 2,
        out_for_delivery: 3,
        delivered: 4
    };

    const currentStep = statusOrder[status] ?? -1;

    let html = `<div class="tracking">`;

    steps.forEach((step, index) => {

        const active = index <= currentStep ? "active" : "";

        html += `
            <div class="tracking-step ${active}">
                <div class="tracking-dot">
                    ${index <= currentStep ? "✓" : ""}
                </div>

                <div class="tracking-label">
                    ${step[1]}
                </div>
            </div>
        `;
    });

    html += `</div>`;

    return html;
}




function toggleOrderDetails(orderId) {

    const currentDetails =
        document.getElementById("orderDetails-" + orderId);

    if (!currentDetails) return;


    // Sabhi open order details ko close karo
    document.querySelectorAll(".order-details").forEach(details => {

        if (details.id !== "orderDetails-" + orderId) {
            details.style.display = "none";
        }

    });


    // Current order ko open / close karo
    if (currentDetails.style.display === "none") {

        currentDetails.style.display = "block";

    } else {

        currentDetails.style.display = "none";

    }
}


function loadOrders() {

    fetch("/orders/", {
        method: "GET",
        credentials: "same-origin"
    })

    .then(response => {

        if (!response.ok) {
            throw new Error("Orders request failed");
        }

        return response.json();
    })

    .then(data => {

        // console.log("ORDERS:", data);

        const container =
            document.getElementById("ordersContainer");

        if (!data.success) {

            container.innerHTML = `
                <div class="empty-orders">
                    <div class="empty-icon">⚠️</div>
                    <h3>Unable to Load Orders</h3>
                    <p>Please try again.</p>
                </div>
            `;

            return;
        }

        if (!data.orders || data.orders.length === 0) {

            container.innerHTML = `
                <div class="empty-orders">

                    <div class="empty-icon">
                        📦
                    </div>

                    <h3>No Orders Yet</h3>

                    <p>
                        You haven't placed any orders yet.
                    </p>

                    <a href="/dashboard/" class="shop-btn">
                        Continue Shopping
                    </a>

                </div>
            `;

            return;
        }

        let html = "";

        data.orders.forEach(order => {

            /* =========================
               ORDER PRODUCTS
            ========================= */

            let itemsHtml = "";

            order.items.forEach(item => {

                let imageHtml = "";

                if (item.image) {

                    imageHtml = `
                        <img
                            src="${item.image}"
                            class="product-image"
                            alt="${item.name}"
                        >
                    `;

                } else {

                    imageHtml = `
                        <div class="product-placeholder">
                            📦
                        </div>
                    `;
                }

                itemsHtml += `
                    <div class="order-product">

                        ${imageHtml}

                        <div class="product-info">

                            <div class="product-name">
                                ${item.name}
                            </div>

                            <div class="product-price">
                                ₹${item.price}
                            </div>

                        </div>

                        <div class="product-total">
                            ₹${item.total}
                        </div>

                    </div>
                `;
            });


            /* =========================
               PAYMENT ID
            ========================= */

            let paymentIdHtml = "";

            if (order.payment_id) {

                paymentIdHtml = `
                    <div>
                        Payment ID:
                        <strong>
                            ${order.payment_id}
                        </strong>
                    </div>
                `;
            }


            /* =========================
               INVOICE BUTTON
            ========================= */

            let invoiceButtonHtml = "";

            if (order.status === "delivered") {

                invoiceButtonHtml = `
                    <a
                        href="/download-invoice/${order.id}/"
                        class="invoice-btn"
                        onclick="event.stopPropagation();"
                    >
                        📄 Download Invoice PDF
                    </a>
                `;
                
            }


            let cancelButtonHtml = "";

                if (
                    order.status === "pending" ||
                    order.status === "confirmed"
                ) {

                    cancelButtonHtml = `
                        <button
                            class="cancel-btn"
                            onclick="cancelOrder(event, ${order.id})"
                        >

function cancelOrder(event, orderId) {

    event.stopPropagation();

    const confirmCancel = confirm(
        "Are you sure you want to cancel this order?"
    );

    if (!confirmCancel) {
        return;
    }

    const csrfElement =
        document.querySelector(
            '[name=csrfmiddlewaretoken]'
        );

    if (!csrfElement) {
        alert("CSRF token not found");
        return;
    }

    fetch("/update-order-status/", {
        method: "POST",
        credentials: "same-origin",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfElement.value
        },
        body: JSON.stringify({
            order_id: orderId,
            status: "cancelled"
        })
    })
    .then(response => response.json())
    .then(data => {

        // console.log("CANCEL ORDER:", data);

        if (data.success) {

            alert("Order cancelled successfully.");

            loadOrders();

            if (typeof loadNotificationCount === "function") {
                loadNotificationCount();
            }

        } else {

            alert(
                data.message ||
                "Unable to cancel order."
            );
        }
    })
    .catch(error => {

        console.error(
            "Cancel order error:",
            error
        );

        alert("Something went wrong.");
    });

// 
}
loadOrders();

</script>

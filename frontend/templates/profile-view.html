<style>
.profile-view-box {
    background: #fff !important;
    border: 1px solid #dfe5ee !important;
    border-radius: 22px !important;
    padding: 35px 50px 42px !important;
    width: 100% !important;
    max-width: 812px !important;
    margin: 0 auto !important;
    box-sizing: border-box !important;
    font-family: Arial, sans-serif;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
}

/* HEADER */
.profile-view-header {
    display: flex;
    align-items: center;
    gap: 25px;
    padding-bottom: 30px;
    border-bottom: 1px solid #e5e7eb;
}

.profile-view-avatar {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    background: #eef5ff;
    border: 4px solid #d8e7ff;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 40px;
    flex-shrink: 0;
}

.profile-view-title h1 {
    margin: 0;
    font-size: 36px;
    line-height: 1.1;
    font-weight: 700;
    color: #111827;
}

.profile-view-title p {
    margin: 7px 0 0;
    font-size: 17px;
    font-weight: 400;
    color: #64748b;
}


/* PROFILE FIELDS */
.profile-view-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 26px 28px;
    margin-top: 78px;
}

.profile-view-field label {
    display: block;
    margin-bottom: 10px;

    font-size: 16px;
    line-height: 1.2;
    font-weight: 700;

    color: #1f2937;
}

.profile-view-value {
    width: 100%;
    height: 64px;

    display: flex;
    align-items: center;

    padding: 0 20px;
    box-sizing: border-box;

    border: 1px solid #d8e0eb;
    border-radius: 13px;

    background: #fbfcfe;

    font-size: 18px;
    font-weight: 400;
    color: #111827;

    overflow: hidden;
}

.profile-view-icon {
    width: 28px;
    min-width: 28px;
    margin-right: 14px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;
}


/* STATUS */
.profile-view-field:last-child .profile-view-value {
    color: #15803d;
}

.profile-view-field:last-child .profile-view-icon {
    font-size: 18px;
}


/* EDIT BUTTON */
.profile-edit-area {
    display: flex;
    gap: 28px;
    margin-top: 35px;
    flex-wrap: wrap;
}

.profile-edit-btn {
    height: 58px;
    min-width: 190px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 0 28px;
    box-sizing: border-box;

    border-radius: 9px;

    background: #2868d8;
    color: #fff;

    text-decoration: none;

    font-size: 17px;
    font-weight: 700;

    transition: background .2s ease, transform .15s ease;
}

.profile-edit-btn:hover {
    background: #1d56bb;
}

.profile-edit-btn:active {
    transform: scale(.98);
}


/* DARK MODE */
body.dark-mode .profile-view-box {
    background: #1e1e1e !important;
    border: 1px solid #444 !important;
    box-shadow: none;
}

body.dark-mode .profile-view-title h1 {
    color: #fff;
}

body.dark-mode .profile-view-title p {
    color: #aaa;
}

body.dark-mode .profile-view-header {
    border-color: #444;
}

body.dark-mode .profile-view-field label {
    color: #fff;
}

body.dark-mode .profile-view-value {
    background: #292929;
    border-color: #555;
    color: #fff;
}

body.dark-mode .profile-view-field:last-child .profile-view-value {
    color: #4ade80;
}


/* MOBILE */
@media (max-width: 700px) {

    .profile-view-box {
        width: 100%;
        max-width: 100%;
        padding: 25px 20px 35px;
    }

    .profile-view-header {
        gap: 15px;
    }

    .profile-view-avatar {
        width: 68px;
        height: 68px;
        font-size: 33px;
    }

    .profile-view-title h1 {
        font-size: 28px;
    }

    .profile-view-title p {
        font-size: 14px;
    }

    .profile-view-fields {
        grid-template-columns: 1fr;
        margin-top: 45px;
    }

    .profile-edit-btn {
        width: 100%;
    }
}
</style>

<div class="profile-view-box">

    <!-- HEADER -->
    <div class="profile-view-header">

        <div class="profile-view-avatar">
            👤
        </div>

        <div class="profile-view-title">
            <h1>My Profile</h1>
            <p>View your personal information</p>
        </div>

    </div>


    <!-- PROFILE DETAILS -->
    <div class="profile-view-fields">

        <!-- FULL NAME -->
        <div class="profile-view-field">

            <label>Full Name</label>

            <div class="profile-view-value">
                <span class="profile-view-icon">👤</span>
                <span id="profileName">Loading...</span>
            </div>

        </div>


        <!-- EMAIL -->
        <div class="profile-view-field">

            <label>Email Address</label>

            <div class="profile-view-value">
                <span class="profile-view-icon">✉️</span>
                <span id="profileEmail">Loading...</span>
            </div>

        </div>


        <!-- PHONE -->
        <div class="profile-view-field">

            <label>Phone Number</label>

            <div class="profile-view-value">
                <span class="profile-view-icon">📱</span>
                <span id="profilePhone">Loading...</span>
            </div>

        </div>


        <!-- ACCOUNT STATUS -->
        <div class="profile-view-field">

            <label>Account Status</label>

            <div class="profile-view-value">
                <span class="profile-view-icon">🟢</span>
                <span>Active</span>
            </div>

        </div>

    </div>


    <!-- EDIT BUTTON -->
    <div class="profile-edit-area">

        <a href="/edit-profile/" class="profile-edit-btn">
            ✏️ Edit Profile
        </a>

          

        <a href="/dashboard/" class="profile-edit-btn">
            🏠 Dashboard
        </a>

  

    </div>

</div>
  <!-- EDIT BUTTON -->
 

</div>


<script>
document.addEventListener("DOMContentLoaded", function () {

    fetch("/profile/", {
        method: "GET",
        credentials: "include"
    })

    .then(response => response.json())

    .then(data => {

        if (data.success) {

            document.getElementById("profileName").innerText =
                data.name || "Not Available";

            document.getElementById("profileEmail").innerText =
                data.email || "Not Available";

            document.getElementById("profilePhone").innerText =
                data.phone || "Not Available";

        } else {

            document.getElementById("profileName").innerText =
                "Not Available";

            document.getElementById("profileEmail").innerText =
                "Not Available";

            document.getElementById("profilePhone").innerText =
                "Not Available";
        }

    })

    .catch(error => {

        console.error("Profile Error:", error);

        document.getElementById("profileName").innerText =
            "Not Available";

        document.getElementById("profileEmail").innerText =
            "Not Available";

        document.getElementById("profilePhone").innerText =
            "Not Available";
    });

});
</script>

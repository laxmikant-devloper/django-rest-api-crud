{% extends "base.html" %}

{% block title %}Reviews{% endblock %}

 {% block extra_css %}
<style>
/* ==============================
   REVIEWS MOBILE FIX
============================== */

@media (max-width: 600px) {

    .card {
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
    }

    #reviewsContainer {
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
    }

    /* Review card */
    #reviewsContainer > div {
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
        padding: 14px !important;
        overflow: hidden !important;
    }

    /* Product row */
    #reviewsContainer > div > div {
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
        display: flex !important;
        gap: 12px !important;
        align-items: flex-start !important;
    }

    /* Product image */
    #reviewsContainer > div > div > div:first-child {
        width: 100px !important;
        height: 100px !important;
        min-width: 100px !important;
        flex: 0 0 100px !important;
    }

    /* Product details */
    #reviewsContainer > div > div > div:nth-child(2) {
        flex: 1 !important;
        min-width: 0 !important;
        max-width: calc(100% - 112px) !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
    }

    /* Product name */
    #reviewsContainer h3 {
        font-size: 18px !important;
        line-height: 1.3 !important;
        margin: 0 0 8px 0 !important;
        overflow-wrap: anywhere !important;
    }

    /* Your Review box */
    #reviewsContainer > div > div > div:nth-child(2) > div {
        max-width: 100% !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
    }

    /* Review text */
    #reviewsContainer p {
        max-width: 100% !important;
        overflow-wrap: anywhere !important;
        word-break: break-word !important;
    }

    /* Stars */
    #reviewsContainer [id^="stars-"] {
        font-size: 26px !important;
        letter-spacing: 1px !important;
        white-space: nowrap !important;
    }

    /* Textarea */
    #reviewsContainer textarea {
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
    }

    /* Button */
    #reviewsContainer button {
        max-width: 100% !important;
        box-sizing: border-box !important;
    }
}
</style>
{% endblock %}
{% block content %}

<div class="card">

    <div class="section-title">
        <h2>⭐ My Reviews</h2>
    </div>

    {% csrf_token %}

    <div id="reviewsContainer">

        <p style="color:#777;">
            Loading delivered products...
        </p>

    </div>

</div>


<script>

let reviewsData = [];


/* =========================
   LOAD DELIVERED PRODUCTS
========================= */

function loadReviews() {

    fetch("/reviews/", {
        method: "GET",
        credentials: "same-origin"
    })

    .then(response => {

        if (!response.ok) {
            throw new Error("Reviews request failed");
        }

        return response.json();

    })

    .then(data => {

        console.log("REVIEWS:", data);

        const container =
            document.getElementById("reviewsContainer");


        if (!data.success) {

            container.innerHTML = `
                <p style="color:red;">
                    Unable to load reviews.
                </p>
            `;

            return;
        }


        reviewsData = data.reviews || [];


        if (reviewsData.length === 0) {

            container.innerHTML = `
                <div style="
                    padding:30px;
                    text-align:center;
                    color:#777;
                ">
                    <div style="font-size:50px;">
                        ⭐
                    </div>

                    <h3>
                        No Delivered Products
                    </h3>

                    <p>
                        You can review products after they are delivered.
                    </p>
                </div>
            `;

            return;
        }


        let html = "";


        reviewsData.forEach(item => {

            html += `

                <div style="
                    border:1px solid #ddd;
                    border-radius:12px;
                    padding:20px;
                    margin-bottom:20px;
                    background:white;
                ">

                    <div style="
                        display:flex;
                        gap:20px;
                        align-items:flex-start;
                    ">

                        <!-- PRODUCT IMAGE -->

                        <div style="
                            width:100px;
                            height:100px;
                            border:1px solid #ddd;
                            border-radius:8px;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            overflow:hidden;
                            flex-shrink:0;
                        ">

                            ${
                                item.product_image
                                ?
                                `<img
                                    src="${item.product_image}"
                                    style="
                                        width:100%;
                                        height:100%;
                                        object-fit:contain;
                                    "
                                >`
                                :
                                `<span style="font-size:40px;">
                                    📦
                                </span>`
                            }

                        </div>


                        <!-- PRODUCT DETAILS -->

                        <div style="flex:1;">

                            <h3 style="
                                margin:0 0 8px 0;
                            ">
                                ${item.product_name}
                            </h3>

                            <p style="
                                margin:5px 0;
                                color:#666;
                            ">
                                Order #${item.order_id}
                            </p>

                            <p style="
                                margin:5px 0;
                                color:#08a52b;
                                font-weight:600;
                            ">
                                ✓ Delivered
                            </p>

                            ${
                                item.reviewed
                                ?
                                `
                                <div style="
                                    margin-top:15px;
                                    padding:15px;
                                    background:#f5fff7;
                                    border:1px solid #b7e5c0;
                                    border-radius:8px;
                                ">

                                    <strong>
                                        Your Review
                                    </strong>

                                    <div style="
                                        font-size:24px;
                                        margin:5px 0;
                                    ">
                                        ${getStars(item.rating)}
                                    </div>

                                    ${
                                        item.comment
                                        ?
                                        `<p style="
                                            margin:5px 0;
                                            color:#555;
                                        ">
                                            ${item.comment}
                                        </p>`
                                        :
                                        ""
                                    }

                                </div>
                                `
                                :
                                `
                                <div style="
                                    margin-top:15px;
                                ">

                                    <strong>
                                        Rate this product
                                    </strong>

                                    <div
                                        id="stars-${item.order_item_id}"
                                        style="
                                            font-size:30px;
                                            margin:8px 0;
                                            color:#ffc107;
                                            letter-spacing:3px;
                                        "
                                    >

                                        <span
                                            onclick="setRating(${item.order_item_id},1)"
                                            style="cursor:pointer;"
                                        >☆</span>

                                        <span
                                            onclick="setRating(${item.order_item_id},2)"
                                            style="cursor:pointer;"
                                        >☆</span>

                                        <span
                                            onclick="setRating(${item.order_item_id},3)"
                                            style="cursor:pointer;"
                                        >☆</span>

                                        <span
                                            onclick="setRating(${item.order_item_id},4)"
                                            style="cursor:pointer;"
                                        >☆</span>

                                        <span
                                            onclick="setRating(${item.order_item_id},5)"
                                            style="cursor:pointer;"
                                        >☆</span>

                                    </div>


                                    <textarea
                                        id="comment-${item.order_item_id}"
                                        placeholder="Write your review..."
                                        rows="3"
                                        style="
                                            width:100%;
                                            box-sizing:border-box;
                                            padding:10px;
                                            border:1px solid #ccc;
                                            border-radius:7px;
                                            resize:vertical;
                                        "
                                    ></textarea>


                                    <button
                                        onclick="submitReview(${item.order_item_id})"
                                        style="
                                            margin-top:10px;
                                            padding:10px 20px;
                                            background:#08a52b;
                                            color:white;
                                            border:none;
                                            border-radius:7px;
                                            cursor:pointer;
                                            font-weight:600;
                                        "
                                    >
                                        ⭐ Submit Review
                                    </button>

                                </div>
                                `
                            }

                        </div>

                    </div>

                </div>

            `;

        });


        container.innerHTML = html;

    })

    .catch(error => {

        console.error("Review error:", error);

        document.getElementById(
            "reviewsContainer"
        ).innerHTML = `
        
            <p style="color:red;">
                Unable to load delivered products.
            </p>
        `;

    });
}


/* =========================
   RATING
========================= */

let selectedRatings = {};


function setRating(orderItemId, rating) {

    selectedRatings[orderItemId] = rating;

    const stars =
        document.querySelectorAll(
            `#stars-${orderItemId} span`
        );


    stars.forEach((star, index) => {

        if (index < rating) {
            star.innerText = "★";
        } else {
            star.innerText = "☆";
        }

    });

}


/* =========================
   STAR DISPLAY
========================= */

function getStars(rating) {

    let stars = "";

    for (let i = 1; i <= 5; i++) {

        stars += i <= rating ? "★" : "☆";

    }

    return stars;
}


/* =========================
   CSRF
========================= */

function getCSRFToken() {

    const csrfElement =
        document.querySelector(
            '[name=csrfmiddlewaretoken]'
        );

    return csrfElement
        ? csrfElement.value
        : "";

}


/* =========================
   SUBMIT REVIEW
========================= */

function submitReview(orderItemId) {

    const rating =
        selectedRatings[orderItemId];


    const commentElement =
        document.getElementById(
            `comment-${orderItemId}`
        );


    const comment =
        commentElement
        ? commentElement.value.trim()
        : "";


    if (!rating) {

        alert("Please select a star rating.");

        return;
    }


    const csrfToken =
        getCSRFToken();


    fetch("/reviews/", {

        method: "POST",

        credentials: "same-origin",

        headers: {

            "Content-Type": "application/json",

            "X-CSRFToken": csrfToken

        },

        body: JSON.stringify({

            order_item_id: orderItemId,

            rating: rating,

            comment: comment

        })

    })

    .then(response => response.json())

    .then(data => {

        console.log("REVIEW RESPONSE:", data);


        if (data.success) {

            alert(
                "⭐ Review submitted successfully!"
            );

            loadReviews();

        } else {

            alert(
                data.message ||
                "Unable to submit review."
            );

        }

    })

    .catch(error => {

        console.error(
            "Submit review error:",
            error
        );

        alert(
            "Something went wrong."
        );

    });

}


/* =========================
   PAGE LOAD
========================= */

loadReviews();

</script>

{% endblock %}

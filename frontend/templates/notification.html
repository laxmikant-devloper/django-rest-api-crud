{% extends "base.html" %}

{% block title %}
Notifications
{% endblock %}

{% block content %}

<div style="padding: 25px;">

    <h2 style="margin-bottom: 20px;">
        🔔 Notifications
    </h2>

    <div id="notificationsContainer">
        <p style="color:#777;">
            Loading notifications...
        </p>
    </div>

</div>

{% endblock %}




{% block extra_js %}
<script>
function markNotificationRead(notificationId) {

    const csrfElement =
        document.querySelector(
            '[name=csrfmiddlewaretoken]'
        );

    if (!csrfElement) {
        console.error("CSRF token not found");
        return;
    }

    fetch("/notification-read/", {

        method: "POST",

        credentials: "same-origin",

        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfElement.value
        },

        body: JSON.stringify({
            notification_id: notificationId
        })

    })

    .then(response => response.json())

    .then(data => {

        // console.log(
        //     "NOTIFICATION READ:",
        //     data
        // );

        if (data.success) {

            loadNotifications();

            if (typeof loadNotificationCount === "function") {
                loadNotificationCount();
            }

        }

    })

    .catch(error => {

        console.error(
            "Notification read error:",
            error
        );

    });
}


function loadNotifications() {

    fetch("/notifications/", {
        method: "GET",
        credentials: "same-origin"
    })

    .then(response => {

        if (!response.ok) {
            throw new Error(
                "Notifications request failed: " +
                response.status
            );
        }

        return response.json();
    })

    .then(data => {

        // console.log("NOTIFICATIONS:", data);

        const container =
            document.getElementById(
                "notificationsContainer"
            );

        if (!container) {
            return;
        }

        if (
            !data.success ||
            !data.notifications ||
            data.notifications.length === 0
        ) {

            container.innerHTML = `
                <div style="
                    text-align:center;
                    padding:40px;
                    color:#777;
                ">
                    🔔
                    <p>No notifications yet.</p>
                </div>
            `;

            return;
        }

        let html = "";

        data.notifications.forEach(notification => {

            html += `
                <div  onclick="markNotificationRead(${notification.id})"   style="
                    padding:18px;
                    margin-bottom:12px;
                    border:1px solid #eee;
                    border-radius:10px;
                    background:${
                        notification.is_read
                            ? "#ffffff"
                            : "#f5f9ff"
                    };
                ">

                    <div style="
                        font-size:15px;
                        font-weight:${
                            notification.is_read
                                ? "400"
                                : "600"
                        };
                    ">
                        🔔 ${notification.message}
                    </div>

                    <div style="
                        margin-top:7px;
                        color:#888;
                        font-size:12px;
                    ">
                        ${notification.created_at}
                    </div>

                </div>
            `;
        });

        container.innerHTML = html;

    })

    .catch(error => {

        console.error(
            "Notifications error:",
            error
        );

    });
}


loadNotifications();
</script>

{% endblock %}
